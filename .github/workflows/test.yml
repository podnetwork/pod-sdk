name: Test

on:
  push:
    branches: ["main"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.95

      - uses: Swatinem/rust-cache@v2

      - name: Version
        run: cargo version

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

  # Until this job existed, no CI anywhere touched the TypeScript — a broken
  # ts-sdk only surfaced when a downstream image build failed. `npm test`
  # (vitest) is here because typecheck and build cannot catch behaviour: the
  # transport dispatched subscription close frames to the wrong callback for as
  # long as the file existed, compiling cleanly throughout.
  #
  # publish-ts-sdk.yml re-runs these same steps rather than depending on this
  # job — a tag push can reach it without this workflow having run — so keep the
  # two in step.
  ts-sdk:
    name: ts-sdk
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts-sdk
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ts-sdk/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  protocol:
    name: protocol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.0

      - name: Run Forge fmt
        run: |
          forge fmt --check
        id: fmt
        working-directory: protocol

      - name: Run Forge build
        run: |
          forge build --sizes
        id: build
        working-directory: protocol

      - name: Run Forge tests
        run: |
          forge test -vvv
        id: test
        working-directory: protocol
        env:
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}

      - name: Check bindings
        run: |
          make check
        working-directory: protocol
        id: bindings
